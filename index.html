<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRC Scouting</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0908;
      --surface: #14110f;
      --surface-2: #1f1915;
      --stroke: #000000;
      --stroke-bright: #ff6a00;
      --text: #ff7a1a;
      --muted: #b86b35;
      --accent: #ff6a00;
      --accent-hover: #e05c00;
      --ok-bg: #162619;
      --ok-stroke: #4d995c;
      --err-bg: #2b1312;
      --err-stroke: #c44d47;
      --logo-bg: #1c1612;
    }

    * {
      box-sizing: border-box;
      border-radius: 5px !important;
      box-shadow: none !important;
    }

    *::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px 56px;
      line-height: 1.4;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1.5px solid var(--stroke);
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    .top-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--stroke);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .nav-btn:hover,
    .nav-btn.active {
      border-color: var(--stroke-bright);
      background: var(--surface-2);
    }

    .panel {
      background: var(--surface);
      border: 1.5px solid var(--stroke);
      padding: 22px;
    }

    h1,
    h2 {
      margin: 0 0 4px;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .sub {
      margin: 0 0 20px;
      padding-bottom: 14px;
      font-size: 0.88rem;
      color: var(--muted);
      border-bottom: 1px solid var(--stroke);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="number"],
    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea {
      width: 100%;
      background: var(--bg) !important;
      color: var(--text);
      border: 1.5px solid var(--stroke);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--stroke-bright);
      background: #2c241e;
    }

    .counter {
      background: var(--surface-2);
      border: 1.5px solid var(--stroke);
      padding: 12px;
    }

    .counter-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .counter-num {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .step-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .step-btn {
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--stroke);
      padding: 8px 0;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .step-btn:hover {
      border-color: var(--stroke-bright);
      background: var(--surface-2);
    }

    .information,
    .booleans {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tag-btn,
    .bool-btn {
      background: var(--bg);
      color: var(--muted);
      border: 1.5px solid var(--stroke);
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tag-btn:hover,
    .bool-btn:hover {
      color: var(--text);
      border-color: var(--stroke-bright);
    }

    .tag-btn.active,
    .bool-btn.active {
      color: var(--text);
      border-color: var(--stroke-bright);
      background: var(--surface-2);
    }

    textarea {
      min-height: 84px;
      font-size: 0.92rem;
      font-weight: 400;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      margin-top: 4px;
      padding: 13px 16px;
      background: var(--accent);
      color: #0a0908;
      border: 1.5px solid var(--stroke-bright);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 11px 13px;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1.5px solid var(--stroke);
    }

    .status.show {
      display: block;
    }

    .status.ok {
      background: var(--ok-bg);
      border-color: var(--ok-stroke);
      color: #d4edd8;
    }

    .status.err {
      background: var(--err-bg);
      border-color: var(--err-stroke);
      color: #f4d2d0;
    }

    .hidden {
      display: none !important;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .toolbar input {
      flex: 1;
      min-width: 160px;
    }

    .table-wrap {
      overflow: auto;
      max-height: 70vh;
      border: 1.5px solid var(--stroke);
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      font-size: 0.88rem;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .table-wrap::-webkit-scrollbar {
      display: none;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: start;
      white-space: nowrap;
      border-bottom: 1px solid var(--stroke);
      border-inline-end: 1px solid var(--stroke);
    }

    th:last-child,
    td:last-child {
      border-inline-end: none;
    }

    th {
      background: var(--surface-2);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    tr:nth-child(even) td {
      background: rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 520px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      border-bottom: 1px solid var(--stroke);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .panel-head .sub {
      margin: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .avatar {
      width: 64px;
      height: 64px;
      object-fit: scale-down;
      border: 1.5px solid var(--stroke);
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top-bar">
      <span class="top-title" data-i18n="appTitle">FRC Scouting</span>
      <div class="nav-actions">
        <button type="button" class="nav-btn active" id="tabScout" data-i18n="tabScout">Scout Form</button>
        <button type="button" class="nav-btn" id="tabData" data-i18n="tabData">View Data</button>
        <button type="button" class="nav-btn" id="languageBtn" aria-label="Switch to Arabic">العربية</button>
      </div>
    </div>

    <!-- SCOUTING FORM VIEW -->
    <div class="panel" id="scoutView">
      <div class="panel-head">
        <div>
          <h1 data-i18n="matchScouting">Match Scouting</h1>
          <p class="sub" data-i18n="matchSub">Enter match numbers and notes directly into the database.</p>
        </div>
        <img style="background:var(--logo-bg)" src="Avatar.png" alt="Team avatar" class="avatar" />
      </div>

      <form id="scoutForm">
        <div class="grid-2">
          <div class="field">
            <label for="teamNumber" data-i18n="teamNumber">Team Number</label>
            <input type="number" id="teamNumber" placeholder="254" min="1" required />
          </div>
          <div class="field">
            <label for="matchNumber" data-i18n="matchNumber">Match Number</label>
            <input type="number" id="matchNumber" placeholder="1" min="1" required />
          </div>
        </div>

        <div class="grid-2 field">
          <div class="counter">
            <div class="counter-top">
              <label for="autoPoints" style="margin:0;" data-i18n="autoPoints">Auto Points</label>
              <span class="counter-num" id="autoPreview">0</span>
            </div>
            <input type="number" id="autoPoints" value="0" min="0" required />
            <div class="step-grid">
              <button type="button" class="step-btn" data-target="autoPoints" data-delta="-1">-1</button>
              <button type="button" class="step-btn" data-target="autoPoints" data-delta="1">+1</button>
              <button type="button" class="step-btn" data-target="autoPoints" data-delta="2">+2</button>
              <button type="button" class="step-btn" data-target="autoPoints" data-delta="5">+5</button>
            </div>
          </div>

          <div class="counter">
            <div class="counter-top">
              <label for="teleopPoints" style="margin:0;" data-i18n="teleopPoints">Teleop Points</label>
              <span class="counter-num" id="teleopPreview">0</span>
            </div>
            <input type="number" id="teleopPoints" value="0" min="0" required />
            <div class="step-grid">
              <button type="button" class="step-btn" data-target="teleopPoints" data-delta="-1">-1</button>
              <button type="button" class="step-btn" data-target="teleopPoints" data-delta="1">+1</button>
              <button type="button" class="step-btn" data-target="teleopPoints" data-delta="2">+2</button>
              <button type="button" class="step-btn" data-target="teleopPoints" data-delta="5">+5</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label data-i18n="problems">problems</label>
          <div class="booleans">
            <button type="button" class="bool-btn" data-tag="broke" data-i18n="tag_broke">Broke</button>
            <button type="button" class="bool-btn" data-tag="slow_speed" data-i18n="tag_slow_speed">Slow speed</button>
            <button type="button" class="bool-btn" data-tag="slow_intake" data-i18n="tag_slow_intake">Slow intake</button>
            <button type="button" class="bool-btn" data-tag="slow_shooting" data-i18n="tag_slow_shooting">Slow shooting</button>
            <button type="button" class="bool-btn" data-tag="bad_accuracy" data-i18n="tag_bad_accuracy">Bad accuracy</button>
            <button type="button" class="bool-btn" data-tag="no_autonomous" data-i18n="tag_no_autonomous">No autonomous</button>
          </div>

          <label data-i18n="information">information</label>
          <div class="information">
            <button type="button" class="tag-btn" data-tag="strong_defense" data-i18n="tag_strong_defense">Strong defense</button>
            <button type="button" class="tag-btn" data-tag="fast_intake" data-i18n="tag_fast_intake">Fast intake</button>
            <button type="button" class="tag-btn" data-tag="good_driver" data-i18n="tag_good_driver">Good driver</button>
          </div>

          <label for="notes" data-i18n="notesLabel">additional notes</label>
          <textarea id="notes" placeholder="Tap a tag or write notes..." data-i18n-placeholder="notesPlaceholder"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn" data-i18n="submitMatch">Submit Match</button>
      </form>

      <div id="status" class="status"></div>
    </div>

    <!-- PROTECTED DATA VIEW -->
    <div class="panel hidden" id="dataView">
      <!-- LOGIN GATE -->
      <div id="authGate">
        <h2 data-i18n="strategyAccess">Strategy Access</h2>
        <p class="sub" data-i18n="strategySub">Sign in with your team credentials to view scouting logs.</p>
        <form id="loginForm">
          <div class="field">
            <label for="loginEmail" data-i18n="teamEmail">Team Email</label>
            <input type="email" id="loginEmail" placeholder="Shared team email" data-i18n-placeholder="teamEmailPlaceholder" required />
          </div>
          <div class="field">
            <label for="loginPass" data-i18n="password">Password</label>
            <input type="password" id="loginPass" placeholder="••••••••" required />
          </div>
          <button type="submit" class="submit-btn" id="loginBtn" data-i18n="unlockTables">Unlock Tables</button>
        </form>
        <div id="authStatus" class="status"></div>
      </div>

      <!-- DATA TABLE (SHOWN WHEN LOGGED IN) -->
      <div id="tableSection" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <h2 data-i18n="scoutingLogs">Scouting Logs</h2>
          <button type="button" class="nav-btn" id="logoutBtn" data-i18n="signOut">Lock / Sign Out</button>
        </div>
        <p class="sub" id="rowCount" data-i18n="loadingEntries">Loading entries...</p>

        <div class="toolbar">
          <input type="text" id="teamFilter" placeholder="Filter by team # (e.g. 254)..." data-i18n-placeholder="filterPlaceholder" />
          <button type="button" class="nav-btn" id="refreshBtn" data-i18n="refresh">Refresh</button>
          <button type="button" class="nav-btn" id="csvBtn" data-i18n="exportCsv">Export CSV</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-i18n="thTeam">Team</th>
                <th data-i18n="thMatch">Match</th>
                <th data-i18n="thAuto">Auto</th>
                <th data-i18n="thTeleop">Teleop</th>
                <th data-i18n="thTotal">Total</th>
                <th data-i18n="thNotes">Notes</th>
                <th data-i18n="thTags">Tags</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <h1 style="text-align:center; margin-top:15px; font-size:0.875rem; color:var(--muted);">Created by <a
      href="https://github.com/bakirwtd" target="_blank" style="color:var(--accent); text-decoration:none;">Bakir</a>,
    Powered by <a href="https://supabase.com" target="_blank"
      style="color:var(--accent); text-decoration:none;">Supabase</a> & <a href="https://github.com" target="_blank"
      style="color:var(--accent); text-decoration:none;">GitHub</a>
  </h1>
  <img style="display:block; margin:0 auto; border: none; outline: none;" src="Avatar.png" alt="Team avatar"
    class="avatar" />

  <script>
    const SUPABASE_URL = "https://salsqxwuazajymakgvol.supabase.co";
    const SUPABASE_KEY = "sb_publishable_l5LBLPal6EOfObUxkpYL-w_jUwrAMff";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Translations (English <-> Arabic)
    const translations = {
      en: {
        langToggle: "العربية",
        langAria: "Switch to Arabic",
        appTitle: "FRC Scouting",
        tabScout: "Scout Form",

        information: "information",

        notesPlaceholder: "Tap a tag or write notes...",
        submitMatch: "Submit Match",
        strategyAccess: "Strategy Access",
        strategySub: "Sign in with your team credentials to view scouting logs.",
        teamEmail: "Team Email",
        teamEmailPlaceholder: "Shared team email",
        password: "Password",
        unlockTables: "Unlock Tables",
        scoutingLogs: "Scouting Logs",
        signOut: "Lock / Sign Out",
        filterPlaceholder: "Filter by team # (e.g. 254)...",
        refresh: "Refresh",
        exportCsv: "Export CSV",
        thTeam: "Team",
        thMatch: "Match",
        thAuto: "Auto",
        thTeleop: "Teleop",
        thTotal: "Total",
        thNotes: "Notes",
        thTags: "Tags",
        noMatches: "No matching entries found.",
        loadingEntries: "Loading entries...",
        showingEntries: (shown, total) => `Showing ${shown} of ${total} entries`,
        saving: "Saving...",
        savedMsg: (match, team) => `Saved Match #${match} for Team ${team}.`,
        checkingCreds: "Checking credentials...",
        tag_broke: "Broke",
        tag_slow_speed: "Slow speed",
        tag_slow_intake: "Slow intake",
        tag_slow_shooting: "Slow shooting",

        tag_no_autonomous: "No autonomous",
        tag_strong_defense: "Strong defense",
        tag_fast_intake: "Fast intake",
        tag_good_driver: "Good driver"
      },
      ar: {
        langToggle: "English",

        information: "معلومات إيجابية",

        saving: "جارٍ الحفظ...",
        savedMsg: (match, team) => `تم حفظ المباراة #${match} للفريق ${team}.`,
        checkingCreds: "جارٍ التحقق من البيانات...",

        tag_slow_intake: "التقاط بطيء",

        tag_strong_defense: "دفاع قوي",
        tag_fast_intake: "التقاط سريع",
        tag_good_driver: "سائق ممتاز"
      }
    };

    let currentLang = localStorage.getItem("frc_lang") || "en";
    const languageBtn = document.getElementById("languageBtn");

    function t(key, ...args) {
      const dict = translations[currentLang] || translations.en;
      const val = dict[key] ?? translations.en[key];
      return typeof val === "function" ? val(...args) : val;
    }

    function applyLanguage(lang) {
      currentLang = lang === "ar" ? "ar" : "en";
      localStorage.setItem("frc_lang", currentLang);

      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

      languageBtn.textContent = t("langToggle");
      languageBtn.setAttribute("aria-label", t("langAria"));

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.dataset.i18n;
        const val = t(key);
        if (typeof val === "string") el.textContent = val;
      });

      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        const key = el.dataset.i18nPlaceholder;
        const val = t(key);
        if (typeof val === "string") el.placeholder = val;
      });

      if (!tableSection.classList.contains("hidden")) {
        renderTable();
      }
    }

    languageBtn.addEventListener("click", () => {
      applyLanguage(currentLang === "en" ? "ar" : "en");
    });

    // Navigation Tabs
    const tabScout = document.getElementById("tabScout");
    const tabData = document.getElementById("tabData");
    const scoutView = document.getElementById("scoutView");
    const dataView = document.getElementById("dataView");

    tabScout.addEventListener("click", () => {
      tabScout.classList.add("active");
      tabData.classList.remove("active");
      scoutView.classList.remove("hidden");
      dataView.classList.add("hidden");
    });

    tabData.addEventListener("click", async () => {
      tabData.classList.add("active");
      tabScout.classList.remove("active");
      dataView.classList.remove("hidden");
      scoutView.classList.add("hidden");
      await checkSession();
    });

    // Scouting Form Logic
    const autoInput = document.getElementById("autoPoints");
    const teleopInput = document.getElementById("teleopPoints");
    const autoPreview = document.getElementById("autoPreview");
    const teleopPreview = document.getElementById("teleopPreview");
    const notesInput = document.getElementById("notes");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    function syncCounters() {
      autoPreview.textContent = Math.max(0, Number(autoInput.value) || 0);
      teleopPreview.textContent = Math.max(0, Number(teleopInput.value) || 0);
    }

    document.querySelectorAll(".step-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        input.value = Math.max(0, (Number(input.value) || 0) + Number(btn.dataset.delta));
        syncCounters();
      });
    });

    autoInput.addEventListener("input", syncCounters);
    teleopInput.addEventListener("input", syncCounters);

    const indicatorButtons = document.querySelectorAll(".tag-btn, .bool-btn");
    indicatorButtons.forEach((btn) => {
      btn.dataset.selected = "false";
      btn.setAttribute("aria-pressed", "false");
      btn.addEventListener("click", () => {
        const selected = btn.dataset.selected !== "true";
        btn.dataset.selected = String(selected);
        btn.classList.toggle("active", selected);
        btn.setAttribute("aria-pressed", String(selected));
      });
    });

    function showBanner(el, type, msg) {
      el.className = `status show ${type}`;
      el.textContent = msg;
    }

    document.getElementById("scoutForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      showBanner(statusEl, "ok", t("saving"));

      const payload = {
        team_number: Number(document.getElementById("teamNumber").value),
        match_number: Number(document.getElementById("matchNumber").value),
        auto_points: Math.max(0, Number(autoInput.value) || 0),
        teleop_points: Math.max(0, Number(teleopInput.value) || 0),
        notes: notesInput.value,
        ...Object.fromEntries(
          Array.from(indicatorButtons, (btn) => [
            btn.dataset.tag,
            btn.dataset.selected === "true"
          ])
        )
      };

      const { error } = await db.from("scouting").insert([payload]);
      submitBtn.disabled = false;

      if (error) {
        showBanner(statusEl, "err", "Error: " + error.message);
      } else {
        showBanner(statusEl, "ok", t("savedMsg", payload.match_number, payload.team_number));
        e.target.reset();
        autoInput.value = "0";
        teleopInput.value = "0";
        indicatorButtons.forEach((btn) => {
          btn.dataset.selected = "false";
          btn.classList.remove("active");
          btn.setAttribute("aria-pressed", "false");
        });
        syncCounters();
      }
    });

    // Auth & Data Table Logic
    const authGate = document.getElementById("authGate");
    const tableSection = document.getElementById("tableSection");
    const authStatus = document.getElementById("authStatus");
    const tableBody = document.getElementById("tableBody");
    const rowCount = document.getElementById("rowCount");
    const teamFilter = document.getElementById("teamFilter");
    let cachedRows = [];

    async function checkSession() {
      const { data } = await db.auth.getSession();
      if (data.session) {
        authGate.classList.add("hidden");
        tableSection.classList.remove("hidden");
        await loadRows();
      } else {
        authGate.classList.remove("hidden");
        tableSection.classList.add("hidden");
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loginBtn = document.getElementById("loginBtn");
      loginBtn.disabled = true;
      showBanner(authStatus, "ok", t("checkingCreds"));

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPass").value;

      const { error } = await db.auth.signInWithPassword({ email, password });
      loginBtn.disabled = false;

      if (error) {
        showBanner(authStatus, "err", error.message);
      } else {
        authStatus.className = "status";
        e.target.reset();
        await checkSession();
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await db.auth.signOut();
      cachedRows = [];
      tableBody.innerHTML = "";
      await checkSession();
    });

    async function loadRows() {
      rowCount.textContent = t("loadingEntries");
      const { data, error } = await db
        .from("scouting")
        .select("*")
        .order("match_number", { ascending: false });

      if (error) {
        rowCount.textContent = "Error loading table: " + error.message;
        return;
      }

      cachedRows = data || [];
      renderTable();
    }

    function renderTable() {
      const query = teamFilter.value.trim();
      const filtered = query
        ? cachedRows.filter(r => String(r.team_number).includes(query))
        : cachedRows;

      rowCount.textContent = t("showingEntries", filtered.length, cachedRows.length);

      if (!filtered.length) {
        tableBody.innerHTML = `<tr><td colspan="7" style="color:var(--muted);">${t("noMatches")}</td></tr>`;
        return;
      }

      tableBody.innerHTML = filtered.map(r => {
        const auto = Number(r.auto_points) || 0;
        const teleop = Number(r.teleop_points) || 0;
        const safeNotes = (r.notes || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const tags = Object.entries(r)
          .filter(([, value]) => value === true)
          .map(([column]) => {
            const translated = t("tag_" + column);
            return translated && !translated.startsWith("tag_") ? translated : column.replace(/_/g, " ");
          })
          .join(", ") || "—";

        return `
          <tr>
            <td><strong>${r.team_number}</strong></td>
            <td>${r.match_number}</td>
            <td>${auto}</td>
            <td>${teleop}</td>
            <td><strong>${auto + teleop}</strong></td>
            <td>${safeNotes}</td>
            <td>${tags}</td>
          </tr>
        `;
      }).join("");
    }

    teamFilter.addEventListener("input", renderTable);
    document.getElementById("refreshBtn").addEventListener("click", loadRows);

    document.getElementById("csvBtn").addEventListener("click", () => {
      if (!cachedRows.length) return;
      const headers = ["team_number", "match_number", "auto_points", "teleop_points", "total_points", "notes"];
      const lines = [
        headers.join(","),
        ...cachedRows.map(r => {
          const auto = Number(r.auto_points) || 0;
          const teleop = Number(r.teleop_points) || 0;
          const notes = `"${String(r.notes || "").replace(/"/g, '""')}"`;
          return [r.team_number, r.match_number, auto, teleop, auto + teleop, notes].join(",");
        })
      ];
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "frc-scouting.csv";
      a.click();
      URL.revokeObjectURL(url);
    });

    applyLanguage(currentLang);
  </script>
</body>

</html>
